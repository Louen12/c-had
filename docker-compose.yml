services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chad}
      POSTGRES_USER: ${POSTGRES_USER:-chad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chad_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chad}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    volumes:
      - ./api:/srv/api
      - api_vendor:/srv/api/vendor
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: change_me_in_production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-chad}:${POSTGRES_PASSWORD:-chad_dev}@database:5432/${POSTGRES_DB:-chad}?serverVersion=16&charset=utf8"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$$"

  app:
    build:
      context: ./app
    volumes:
      - ./app:/srv/app
      - app_node_modules:/srv/app/node_modules
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:8000/api"

volumes:
  db_data:
  api_vendor:
  app_node_modules:
